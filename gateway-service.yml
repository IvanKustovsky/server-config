server:
  port: 8080

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: "http://localhost:8070/eureka/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: "gateway-service"
    description: "E2Rent Gateway Server Application"
    version: "1.0.0"

open-api:
  endpoints:
    - /auth/api/v1/token
    - /auth/api/v1/validate
    - /auth/api/v1/email
    - /equipments/api/v1/all
    - /users/api/v1/register